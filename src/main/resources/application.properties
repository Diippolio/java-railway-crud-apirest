spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.application.name=apirest
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${MYENV:prod}
spring.datasource.url=${{Postgres.SPRING_DATASOURCE_URL}}
spring.datasource.username=${{Postgres.SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${{Postgres.SPRING_DATASOURCE_PASSWORD}}
server.port=${{PORT}